# Sample run: 6 DAIC-WOZ sessions, 2 per split, 1 depressed + 1 not per split.
# Dev pair has gender flipped relative to train/test so gender is not confounded with label.
dataset:
  base_url: https://dcapswoz.ict.usc.edu/wwwdaicwoz/
  data_dir: data/daicwoz
  sessions: [303, 319, 302, 335, 306, 309]
  # Documented issues (AVEC2017 docs) + commonly cited transcript timing offsets.
  exclude: [318, 321, 341, 342, 362, 373, 394, 398, 444, 451, 458, 460, 480]

segmentation:
  min_dur_s: 1.0        # shorter turns are merged into the nearest participant turn (never dropped)
  short_turns: merge    # v2: span-merge, or splice across an Ellie line (see src/speechlab/segment.py)
  max_dur_s: 30.0       # longer segments are split at a pause
  split_search_s: 3.0   # look for the lowest-energy point within this window before max_dur_s

models:
  whisper_small:
    id: openai/whisper-small
    revision: 973afd24965f72e36ca33b3055d56a652f456b4d
  hubert_base:
    id: facebook/hubert-base-ls960
    revision: dba3bb02fda4248b6e082697eee756de8fe8aa8a
  frame_layers: [0, 6, 12]

text_models:
  roberta_base:
    id: FacebookAI/roberta-base
    revision: e2da8e2f811d1448a5b465c236feacd80ffbac7b
  mpnet:
    id: sentence-transformers/all-mpnet-base-v2
    revision: e8c3b32edf5434bc2275fc9bab85f82640a19130

output:
  dir: outputs/sample_v2
  hf_repo: GenerationGenerative/daic-woz-embeddings-sample
  private: true
  dataset_version: "2.0"
  hf_revision: v2          # stage on this branch; scripts/promote_release.py moves it to main
