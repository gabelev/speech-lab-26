[project]
name = "speechlab"
version = "0.1.0"
description = "Segment-level speech/text embeddings for DAIC-WOZ (Columbia Speech Lab collaboration)"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "sentence-transformers",
  "opensmile",
  "soundfile",
  "librosa",
  "numpy",
  "pandas",
  "pyarrow",
  "safetensors",
  "huggingface_hub",
  "datasets",
  "pyyaml",
  "scikit-learn",
  "matplotlib",
  "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
